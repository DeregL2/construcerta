spring.application.name=construcerta

server.port=${SERVER_PORT:8080}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/construcerta}

spring.session.store-type=mongodb
spring.session.timeout=30m
spring.session.mongodb.collection-name=sessions

spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@construcerta.local}
app.admin.password=${ADMIN_PASSWORD:TrocarSenha123!}

app.theme.name=${THEME_NAME:ConstruCerta Laranja}
app.theme.primary-color=${THEME_PRIMARY_COLOR:#d9641e}
app.theme.secondary-color=${THEME_SECONDARY_COLOR:#f2994a}
app.theme.accent-color=${THEME_ACCENT_COLOR:#2f6f4f}
app.theme.background-color=${THEME_BACKGROUND_COLOR:#fbf4ec}
app.theme.text-color=${THEME_TEXT_COLOR:#2e2015}
app.theme.logo-text=${THEME_LOGO_TEXT:ConstruCerta}

logging.level.org.springframework.security=INFO
