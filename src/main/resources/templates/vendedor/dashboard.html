<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Area do vendedor')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page-content">
    <h1>Area do vendedor</h1>
    <p>
        Ola, <strong th:text="${usuario.fullName}">Vendedor</strong> — cadastre
        e mantenha os itens do catalogo de materiais.
    </p>

    <p class="alert alert-success" th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"></p>

    <section class="card">
        <h2>Novo produto / editar produto</h2>
        <form th:action="@{/vendedor/produtos/salvar}" th:object="${produtoForm}" method="post" class="form">
            <input type="hidden" th:field="*{id}"/>

            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}"/>
            <small class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></small>

            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" th:field="*{categoria}" placeholder="Ex.: Cimento, Tintas, Eletrica"/>
            <small class="field-error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></small>

            <label for="unidadeMedida">Unidade de medida</label>
            <input type="text" id="unidadeMedida" th:field="*{unidadeMedida}" placeholder="Ex.: saco, m2, unidade"/>
            <small class="field-error" th:if="${#fields.hasErrors('unidadeMedida')}" th:errors="*{unidadeMedida}"></small>

            <label for="preco">Preco (R$)</label>
            <input type="number" step="0.01" min="0" id="preco" th:field="*{preco}"/>
            <small class="field-error" th:if="${#fields.hasErrors('preco')}" th:errors="*{preco}"></small>

            <label for="estoque">Estoque</label>
            <input type="number" min="0" id="estoque" th:field="*{estoque}"/>
            <small class="field-error" th:if="${#fields.hasErrors('estoque')}" th:errors="*{estoque}"></small>

            <label class="checkbox-label">
                <input type="checkbox" th:field="*{ativo}"/> Ativo no catalogo
            </label>

            <button type="submit" class="btn-primary">Salvar produto</button>
        </form>
    </section>

    <section class="card">
        <h2>Produtos cadastrados</h2>
        <table class="produto-table" th:if="${not #lists.isEmpty(produtos)}">
            <thead>
            <tr>
                <th>Produto</th>
                <th>Categoria</th>
                <th>Unidade</th>
                <th>Preco</th>
                <th>Estoque</th>
                <th>Ativo</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${produtos}">
                <td th:text="${p.nome}"></td>
                <td th:text="${p.categoria}"></td>
                <td th:text="${p.unidadeMedida}"></td>
                <td th:text="${'R$ ' + #numbers.formatDecimal(p.preco, 1, 2)}"></td>
                <td th:text="${p.estoque}"></td>
                <td th:text="${p.ativo ? 'Sim' : 'Nao'}"></td>
            </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(produtos)}">Nenhum produto cadastrado ainda.</p>
    </section>
</main>
</body>
</html>
